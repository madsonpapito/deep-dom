# squad-design.yaml for Renova 30
squad:
  name: renova-30
  description: "Esquadrão para desenvolver a plataforma de bem-estar digital Renova 30."
  domain: "Plataforma de bem-estar e fitness digital, focada em reposição hormonal natural para mulheres na menopausa."

analysis:
  entities:
    - Aluna
    - Protocolo Personalizado
    - Treino
    - Plano Alimentar
    - Bônus
    - Comunidade
    - Pagamento
  workflows:
    - Jornada de Compra
    - Onboarding da Aluna
    - Consumo de Conteúdo
    - Interação com a Comunidade
    - Acompanhamento de Progresso
  integrations:
    - Gateway de Pagamento
    - Plataforma de Hospedagem de Vídeo
    - Telegram/Facebook API
  stakeholders:
